spring.application.name=Examen
server.port=9002

spring.datasource.url=jdbc:postgresql://localhost:5432/examen_preguntas
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:9000/eureka

# Circuit Breaker hacia ms-estudiantes
resilience4j.circuitbreaker.instances.estudiantes.sliding-window-size=10
resilience4j.circuitbreaker.instances.estudiantes.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.estudiantes.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.estudiantes.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.estudiantes.automatic-transition-from-open-to-half-open-enabled=true